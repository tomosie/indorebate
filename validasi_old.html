<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Account Validation</title>

<style>
    
body{
    font-family: Arial, sans-serif;
    max-width:600px;
    margin:50px auto;
    padding:20px;
}

.btn-gold{
    background: linear-gradient(135deg,#d4af37,#f7d774);
    color:#000;
    border:none;
    padding:14px 25px;
    border-radius:8px;
    font-weight:bold;
    font-size:16px;
    cursor:pointer;
}
.btn-whatsapp{
    display:block;
    text-align:center;
    background:#25D366;
    color:#fff;
    text-decoration:none;
    padding:14px 25px;
    border-radius:8px;
    font-weight:bold;
    font-size:16px;
}
    
h1{
    text-align:center;
}

form{
    display:flex;
    flex-direction:column;
    gap:15px;
}

input, select{
    padding:12px;
    font-size:16px;
    font-family: Arial, sans-serif;
    border:1px solid #ccc;
    border-radius:6px;
    background:#fff;
    color:#000;
}

select{
    appearance:auto;
}

select:invalid{
    color:#777;
}

button{
    padding:14px;
    cursor:pointer;
    font-size:16px;
}

button:disabled{
    opacity:.5;
    cursor:not-allowed;
}

</style>

</head>
<body>

<h1>Indorebate Account Validation</h1>

<form id="validationForm" action="https://formspree.io/f/xrewplql" method="POST">

    <input
        type="text"
        name="full_name"
        placeholder="NAMA LENGKAP"
        required>

    <input
        type="text"
        name="account_number"
        placeholder="NOMOR AKUN TRADING"
        inputmode="numeric"
        pattern="[0-9]+"
        required>

    <select name="broker_name" required>
        <option value="" disabled selected hidden>PILIH NAMA BROKER</option>
        <option value="Headway">Headway</option>
        <option value="Exness">Exness</option>
        <option value="HFM">HFM</option>
        <option value="Tickmill">Tickmill</option>
        <option value="JustMarkets">JustMarkets</option>
        <option value="RoboForex">RoboForex</option>
        <option value="XM Global">XM Global</option>
    </select>

    <input
        type="email"
        name="email"
        placeholder="EMAIL ADDRESS"
        required>

    <button type="submit" class="btn-gold" id="submitBtn" disabled>
        VALIDASI AKUN KLIK DI SINI
    </button>
<a href="https://wa.link/9093p9"
       target="_blank"
       rel="noopener noreferrer"
       class="btn-whatsapp">
        KONFIRMASI ADMIN
    </a>

<p style="text-align:center; font-size:14px; color:#555; margin-top:10px;">
    Harap tekan tombol <strong>KONFIRMASI ADMIN</strong> jika sudah melakukan <strong>VALIDASI ACCOUNT</strong> untuk mempercepat proses validasi.
</p>
    
</form>

<script>
(function () {
    var form = document.getElementById('validationForm');
    var accountNumber = form.querySelector('input[name="account_number"]');
    var submitBtn = document.getElementById('submitBtn');

    accountNumber.addEventListener('input', function () {
        this.value = this.value.replace(/[^0-9]/g, '');
        updateSubmitState();
    });

    form.addEventListener('input', updateSubmitState);
    form.addEventListener('change', updateSubmitState);

    function updateSubmitState() {
        submitBtn.disabled = !form.checkValidity();
    }

    updateSubmitState();
})();
</script>

</body>
</html>
